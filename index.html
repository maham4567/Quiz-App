<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Brain Master | Timer Edition</title>
    <style>
        /* --- MODERN UI & THEME --- */
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --accent-primary: #8b5cf6;
            --accent-secondary: #ec4899;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .hide { display: none; }

        /* --- TIMER BAR --- */
        .timer-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 0;
            left: 0;
        }

        #timer-fill {
            height: 100%;
            width: 100%;
            background: var(--success);
            transition: width 1s linear, background-color 0.3s ease;
        }

        /* --- CATEGORIES --- */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .category-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-5px);
            border-color: var(--accent-primary);
        }

        /* --- QUIZ ELEMENTS --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 60px;
        }

        .options-list { display: grid; gap: 12px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 14px;
            color: white;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .option-btn:hover { border-color: var(--accent-primary); background: rgba(255,255,255,0.1); }
        .option-btn.selected { background: var(--accent-primary); border-color: var(--accent-primary); }

        .footer { margin-top: 30px; display: flex; gap: 10px; }

        .btn-main {
            flex: 1;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-next { background: var(--accent-primary); color: white; }
        .btn-next:hover { opacity: 0.9; transform: scale(1.02); }

        .result-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 480px) {
            .category-grid { grid-template-columns: 1fr; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="app-container">
        <!-- HOME -->
        <div id="home-screen" class="card">
            <h1 style="margin-top:0">Brain Master</h1>
            <p style="color: var(--text-dim); margin-bottom: 25px;">Each question has a 15-second limit. Be fast!</p>
            <div class="category-grid">
                <div class="category-card" onclick="startQuiz('science')"><span>🧪</span><br>Science</div>
                <div class="category-card" onclick="startQuiz('riddles')"><span>🧩</span><br>Riddles</div>
                <div class="category-card" onclick="startQuiz('math')"><span>🔢</span><br>Math</div>
                <div class="category-card" onclick="startQuiz('capitals')"><span>🌍</span><br>Capitals</div>
            </div>
        </div>

        <!-- QUIZ -->
        <div id="quiz-screen" class="card hide">
            <div class="timer-container"><div id="timer-fill"></div></div>
            <div class="header">
                <span id="q-counter" style="color:var(--text-dim)">1/5</span>
                <span id="timer-text" style="font-weight:bold; color:var(--warning)">15s</span>
            </div>
            <div class="question-text" id="question-text">Question Loading...</div>
            <div class="options-list" id="options-list"></div>
            <div class="footer">
                <button id="next-btn" class="btn-main btn-next">Next Question</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="result-screen" class="card hide" style="text-align: center;">
            <h2>Quiz Results</h2>
            <div id="result-score" class="result-score">0/5</div>
            <p id="result-feedback" style="color:var(--text-dim); margin-bottom: 25px;"></p>
            <div class="footer">
                <button onclick="location.reload()" class="btn-main" style="background:rgba(255,255,255,0.1); color:white;">Home</button>
                <button id="retry-btn" class="btn-main btn-next">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = {
            science: [
                { q: "What is the only metal that is liquid at room temperature?", a: ["Gold", "Mercury", "Silver", "Iron"], c: "Mercury" },
                { q: "Which gas do plants absorb from the atmosphere?", a: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], c: "Carbon Dioxide" },
                { q: "How many bones are in the adult human body?", a: ["206", "180", "250", "212"], c: "206" },
                { q: "Hardest natural substance on Earth?", a: ["Steel", "Diamond", "Quartz", "Granite"], c: "Diamond" },
                { q: "Which planet has the most moons?", a: ["Mars", "Jupiter", "Saturn", "Neptune"], c: "Saturn" }
            ],
            riddles: [
                { q: "The more of this there is, the less you see. What is it?", a: ["Mist", "Darkness", "Light", "Shadow"], c: "Darkness" },
                { q: "What has keys but can't open locks?", a: ["A Piano", "A Map", "A Safe", "A Locksmith"], c: "A Piano" },
                { q: "What gets wetter and wetter the more it dries?", a: ["Sea", "Rain", "A Towel", "A Sponge"], c: "A Towel" },
                { q: "What has a head and a tail but no body?", a: ["A Coin", "A Snake", "A Kite", "A Shadow"], c: "A Coin" },
                { q: "What belongs to you, but others use it more?", a: ["Money", "Your Name", "Car", "Phone"], c: "Your Name" }
            ],
            math: [
                { q: "What is 2 + 2 x 2?", a: ["8", "6", "4", "10"], c: "6" },
                { q: "How many sides does a Heptagon have?", a: ["6", "7", "8", "9"], c: "7" },
                { q: "Which number is prime?", a: ["9", "15", "2", "21"], c: "2" },
                { q: "Square root of 144?", a: ["10", "14", "16", "12"], c: "12" },
                { q: "If a=5 and b=10, what is ab + a?", a: ["55", "50", "60", "15"], c: "55" }
            ],
            capitals: [
                { q: "Capital of Australia?", a: ["Sydney", "Melbourne", "Canberra", "Perth"], c: "Canberra" },
                { q: "Capital of Brazil?", a: ["Rio", "Brasília", "Sao Paulo", "Salvador"], c: "Brasília" },
                { q: "Capital of Japan?", a: ["Kyoto", "Osaka", "Hiroshima", "Tokyo"], c: "Tokyo" },
                { q: "Capital of Canada?", a: ["Toronto", "Vancouver", "Ottawa", "Montreal"], c: "Ottawa" },
                { q: "Capital of Turkey?", a: ["Istanbul", "Ankara", "Izmir", "Antalya"], c: "Ankara" }
            ]
        };

        let currentCategory = '';
        let currentQuestions = [];
        let questionIndex = 0;
        let score = 0;
        let selectedAnswer = null;
        let timer;
        let timeLeft = 15;

        function startQuiz(cat) {
            currentCategory = cat;
            currentQuestions = [...quizData[cat]].sort(() => Math.random() - 0.5);
            questionIndex = 0;
            score = 0;
            document.getElementById('home-screen').classList.add('hide');
            document.getElementById('result-screen').classList.add('hide');
            document.getElementById('quiz-screen').classList.remove('hide');
            showQuestion();
        }

        function showQuestion() {
            clearInterval(timer);
            timeLeft = 15;
            selectedAnswer = null;
            updateTimerUI();

            const q = currentQuestions[questionIndex];
            document.getElementById('q-counter').innerText = `${questionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsContainer = document.getElementById('options-list');
            optionsContainer.innerHTML = '';

            [...q.a].sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = opt;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedAnswer = opt;
                };
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleNext(); // Auto-advance on time out
                }
            }, 1000);
        }

        function updateTimerUI() {
            const bar = document.getElementById('timer-fill');
            const text = document.getElementById('timer-text');
            const percentage = (timeLeft / 15) * 100;
            bar.style.width = percentage + "%";
            text.innerText = timeLeft + "s";

            if (timeLeft > 10) bar.style.backgroundColor = "var(--success)";
            else if (timeLeft > 5) bar.style.backgroundColor = "var(--warning)";
            else bar.style.backgroundColor = "var(--danger)";
        }

        function handleNext() {
            if (selectedAnswer === currentQuestions[questionIndex].c) score++;
            
            questionIndex++;
            if (questionIndex < currentQuestions.length) showQuestion();
            else showResults();
        }

        document.getElementById('next-btn').onclick = () => {
            if (!selectedAnswer) {
                alert("Choose an answer before the time runs out!");
                return;
            }
            handleNext();
        };

        function showResults() {
            clearInterval(timer);
            document.getElementById('quiz-screen').classList.add('hide');
            document.getElementById('result-screen').classList.remove('hide');
            document.getElementById('result-score').innerText = `${score}/${currentQuestions.length}`;
            
            const feedback = document.getElementById('result-feedback');
            if (score === 5) feedback.innerText = "Absolute Legend! 🏆";
            else if (score >= 3) feedback.innerText = "Great job! Very smart! ✨";
            else feedback.innerText = "Keep practicing! 🔄";

            document.getElementById('retry-btn').onclick = () => startQuiz(currentCategory);
        }
    </script>
</body>
    </html>
