<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Quiz Experience</title>
    <style>
        /* --- MODERN CSS STYLES --- */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #00dbde 0%, #fc00ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --card-bg: #1e1e2e;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --accent: #00d2ff;
            --correct: #00b894;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Deep, modern gradient background */
            background: radial-gradient(circle at top left, #1e1e2e, #11111d);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Animated background blobs for a modern feel */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-gradient);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .quiz-card {
            background-color: var(--card-bg);
            width: 95%;
            max-width: 550px;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Progress Bar Section */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--secondary-gradient);
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h2 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            line-height: 1.4;
            font-weight: 700;
        }

        /* Answer Buttons */
        .answer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .answer-btn.selected {
            background: var(--primary-gradient);
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        /* Next/Restart Buttons */
        .action-btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: var(--secondary-gradient);
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .hide { display: none; }

        /* Final Screen Styles */
        .result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .final-score {
            font-size: 3rem;
            font-weight: 800;
            margin: 10px 0;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .quiz-card { padding: 25px; }
            h2 { font-size: 1.3rem; }
            .action-btn { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <!-- MAIN QUIZ CARD -->
    <div class="quiz-card" id="quiz-container">
        <div class="progress-container">
            <div class="progress-label">
                <span>General Knowledge</span>
                <span id="progress-text">Question 1/10</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-bar"></div>
            </div>
        </div>

        <h2 id="question-text">Loading question...</h2>

        <div id="answer-grid" class="answer-grid">
            <!-- JS generates buttons here -->
        </div>

        <button id="next-btn" class="action-btn">Next Question</button>
    </div>

    <!-- RESULT CARD -->
    <div class="quiz-card hide" id="result-container">
        <span class="result-icon">🏆</span>
        <h2>Quiz Completed!</h2>
        <p style="color: var(--text-dim);">Your Final Score:</p>
        <div class="final-score" id="score-display">0/10</div>
        <p id="feedback-text" style="margin-bottom: 30px;"></p>
        <button id="restart-btn" class="action-btn">Try Again</button>
    </div>

    <script>
        const questions = [
            { question: "Which planet is known as the 'Red Planet'?", answers: ["Venus", "Mars", "Jupiter", "Saturn"], correct: "Mars" },
            { question: "What is the capital of France?", answers: ["London", "Berlin", "Madrid", "Paris"], correct: "Paris" },
            { question: "Which animal is known as the 'King of the Jungle'?", answers: ["Tiger", "Elephant", "Lion", "Giraffe"], correct: "Lion" },
            { question: "What is the largest mammal in the world?", answers: ["African Elephant", "Blue Whale", "Great White Shark", "Giraffe"], correct: "Blue Whale" },
            { question: "How many continents are there on Earth?", answers: ["5", "6", "7", "8"], correct: "7" },
            { question: "Which fruit is said to keep the doctor away if eaten once a day?", answers: ["Banana", "Apple", "Orange", "Strawberry"], correct: "Apple" },
            { question: "What color are emeralds?", answers: ["Blue", "Red", "Yellow", "Green"], correct: "Green" },
            { question: "Which is the tallest mountain in the world?", answers: ["K2", "Mount Everest", "Kilimanjaro", "Mount Fuji"], correct: "Mount Everest" },
            { question: "What is the name of the gas we breathe to survive?", answers: ["Nitrogen", "Carbon Dioxide", "Oxygen", "Helium"], correct: "Oxygen" },
            { question: "Who painted the Mona Lisa?", answers: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Claude Monet"], correct: "Leonardo da Vinci" }
        ];

        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;

        const questionEl = document.getElementById("question-text");
        const answerGrid = document.getElementById("answer-grid");
        const nextBtn = document.getElementById("next-btn");
        const progressBar = document.getElementById("progress-bar");
        const progressText = document.getElementById("progress-text");
        const quizContainer = document.getElementById("quiz-container");
        const resultContainer = document.getElementById("result-container");
        const scoreDisplay = document.getElementById("score-display");
        const restartBtn = document.getElementById("restart-btn");
        const feedbackText = document.getElementById("feedback-text");

        function initQuiz() {
            currentIndex = 0;
            score = 0;
            quizContainer.classList.remove("hide");
            resultContainer.classList.add("hide");
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            const current = questions[currentIndex];
            
            // Update Progress UI
            const progPercent = ((currentIndex) / questions.length) * 100;
            progressBar.style.width = `${progPercent}%`;
            progressText.innerText = `Question ${currentIndex + 1}/${questions.length}`;
            
            questionEl.innerText = current.question;
            answerGrid.innerHTML = "";

            current.answers.forEach(ans => {
                const btn = document.createElement("button");
                btn.innerText = ans;
                btn.classList.add("answer-btn");
                btn.onclick = () => selectAnswer(btn, ans);
                answerGrid.appendChild(btn);
            });
        }

        function selectAnswer(btn, ans) {
            const allBtns = document.querySelectorAll(".answer-btn");
            allBtns.forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedOption = ans;
        }

        nextBtn.onclick = () => {
            if (!selectedOption) {
                alert("Please select an option to continue!");
                return;
            }

            if (selectedOption === questions[currentIndex].correct) {
                score++;
            }

            currentIndex++;

            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            progressBar.style.width = `100%`;
            quizContainer.classList.add("hide");
            resultContainer.classList.remove("hide");
            scoreDisplay.innerText = `${score}/${questions.length}`;
            
            if (score >= 8) {
                feedbackText.innerText = "Amazing! You're a genius!";
            } else if (score >= 5) {
                feedbackText.innerText = "Good job! You know your stuff.";
            } else {
                feedbackText.innerText = "Keep practicing! You can do better.";
            }
        }

        restartBtn.onclick = initQuiz;

        initQuiz();
    </script>
</body>
    </html>
