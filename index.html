<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainiac | The Infinite Quiz</title>
    <style>
        :root {
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --accent: #00d2ff;
            --purple: #9d50bb;
            --pink: #6e48aa;
            --success: #00b894;
            --error: #ff7675;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            margin: 0;
            background: var(--bg);
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            width: 500px; height: 500px;
            background: linear-gradient(var(--purple), var(--pink));
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: rotate 25s infinite linear;
        }
        @keyframes rotate { from { transform: rotate(0deg) translate(50px); } to { transform: rotate(360deg) translate(50px); } }

        .container { width: 100%; max-width: 550px; z-index: 10; }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hide { display: none; }

        /* TIMER AT TOP */
        .timer-box {
            position: absolute;
            top: 0; left: 0; width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
        }
        #timer-bar {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            transition: width 1s linear;
        }
        .timer-text {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: block;
            color: var(--accent);
        }

        /* CATEGORY GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        .choice-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .choice-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }
        .choice-card i { font-size: 2rem; margin-bottom: 10px; display: block; }

        /* QUIZ ELEMENTS */
        .q-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem; color: #94a3b8; }
        .question { font-size: 1.4rem; font-weight: 600; margin-bottom: 25px; line-height: 1.4; min-height: 80px; }
        .options { display: grid; gap: 12px; }
        .opt-btn {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 16px; border-radius: 15px;
            color: white; text-align: left; cursor: pointer;
            transition: 0.2s; font-size: 1rem;
        }
        .opt-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); }
        .opt-btn.active { background: var(--accent); border-color: var(--accent); font-weight: bold; }

        .btn-next {
            width: 100%; margin-top: 30px; padding: 18px;
            border-radius: 15px; border: none; background: var(--accent);
            color: var(--bg); font-weight: 800; font-size: 1.1rem; cursor: pointer;
        }

        .score-circle {
            font-size: 4rem; font-weight: 900; margin: 20px 0;
            background: linear-gradient(var(--accent), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .card { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="container">
        <!-- HOME -->
        <div id="home" class="card">
            <h1 style="margin-top: 0;">Brainiac</h1>
            <p style="color: #94a3b8;">Pick a category. New questions every time!</p>
            <div class="grid">
                <div class="choice-card" onclick="start('science')"><i>🧪</i>Science</div>
                <div class="choice-card" onclick="start('riddles')"><i>🧩</i>Riddles</div>
                <div class="choice-card" onclick="start('math')"><i>🔢</i>Math</div>
                <div class="choice-card" onclick="start('capitals')"><i>🌍</i>Capitals</div>
            </div>
        </div>

        <!-- QUIZ -->
        <div id="quiz" class="card hide">
            <div class="timer-box"><div id="timer-bar"></div></div>
            <div class="q-header">
                <span id="count">Question 1/5</span>
                <span class="timer-text" id="time-left">15s</span>
            </div>
            <div class="question" id="q-text">Question Loading...</div>
            <div class="options" id="opt-container"></div>
            <button id="next" class="btn-next">Next Question</button>
        </div>

        <!-- RESULT -->
        <div id="result" class="card hide">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score">0/5</div>
            <p id="feedback" style="margin-bottom: 30px; color: #94a3b8;"></p>
            <button onclick="location.reload()" class="btn-next">Play Again</button>
        </div>
    </div>

    <script>
        const database = {
            science: [
                {q: "What is the only metal that is liquid at room temperature?", a: ["Mercury", "Gallium", "Cesium", "Bromine"], c: "Mercury"},
                {q: "Which planet is known as the 'Morning Star'?", a: ["Mars", "Venus", "Jupiter", "Saturn"], c: "Venus"},
                {q: "What is the rarest blood type?", a: ["O-Negative", "B-Positive", "AB-Negative", "A-Positive"], c: "AB-Negative"},
                {q: "How many elements are in the Periodic Table?", a: ["112", "118", "120", "115"], c: "118"},
                {q: "What is the center of an atom called?", a: ["Proton", "Electron", "Nucleus", "Neutron"], c: "Nucleus"},
                {q: "Which gas is most abundant in Earth's atmosphere?", a: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Argon"], c: "Nitrogen"},
                {q: "What is the power house of the cell?", a: ["Nucleus", "Ribosome", "Mitochondria", "Vacuole"], c: "Mitochondria"},
                {q: "How long does it take for sunlight to reach Earth?", a: ["8 Minutes", "5 Minutes", "12 Minutes", "1 Minute"], c: "8 Minutes"},
                {q: "What is the largest organ in the human body?", a: ["Liver", "Brain", "Skin", "Heart"], c: "Skin"},
                {q: "Which scientist proposed the theory of relativity?", a: ["Newton", "Tesla", "Einstein", "Hawking"], c: "Einstein"}
            ],
            riddles: [
                {q: "What has many teeth but cannot bite?", a: ["A Saw", "A Comb", "A Zipper", "A Shark"], c: "A Comb"},
                {q: "The more of this there is, the less you see. What is it?", a: ["Fog", "Darkness", "Light", "Smoke"], c: "Darkness"},
                {q: "What can travel around the world while staying in a corner?", a: ["A Stamp", "A Plane", "The Moon", "A Shadow"], c: "A Stamp"},
                {q: "What has a neck but no head?", a: ["A Bottle", "A Shirt", "A Guitar", "A Snake"], c: "A Bottle"},
                {q: "What has many keys but can't open a single lock?", a: ["A Map", "A Piano", "A Computer", "A Keychain"], c: "A Piano"},
                {q: "How many months have 28 days?", a: ["1", "6", "12", "Depends on the year"], c: "12"},
                {q: "What is full of holes but still holds water?", a: ["A Net", "A Sponge", "A Cloud", "A Sieve"], c: "A Sponge"},
                {q: "What has one eye but can't see?", a: ["A Needle", "A Storm", "A Potato", "A Bat"], c: "A Needle"},
                {q: "What is easy to get into but hard to get out of?", a: ["A Bed", "Trouble", "A Car", "A Secret"], c: "Trouble"},
                {q: "What belongs to you but other people use it more?", a: ["Your Money", "Your Name", "Your Phone", "Your Ideas"], c: "Your Name"}
            ],
            math: [
                {q: "What is 2 + 2 x 2?", a: ["8", "6", "4", "10"], c: "6"},
                {q: "A bat and ball cost $1.10. The bat costs $1.00 more than the ball. How much is the ball?", a: ["$0.10", "$0.05", "$0.01", "$0.15"], c: "$0.05"},
                {q: "How many sides does a Nonagon have?", a: ["7", "8", "9", "10"], c: "9"},
                {q: "If you multiply all numbers on a phone dial, what is the total?", a: ["362,880", "45", "0", "1,000,000"], c: "0"},
                {q: "What is the square root of 169?", a: ["11", "12", "13", "14"], c: "13"},
                {q: "What is 15% of 200?", a: ["20", "30", "25", "35"], c: "30"},
                {q: "How many seconds are in an hour?", a: ["360", "3600", "600", "1200"], c: "3600"},
                {q: "What comes next: 2, 4, 8, 16, ...?", a: ["24", "32", "20", "64"], c: "32"},
                {q: "Which is a prime number?", a: ["1", "4", "2", "9"], c: "2"},
                {q: "What is 100 divided by 0.5?", a: ["50", "200", "100.5", "20"], c: "200"}
            ],
            capitals: [
                {q: "What is the capital of Australia?", a: ["Sydney", "Melbourne", "Canberra", "Perth"], c: "Canberra"},
                {q: "What is the capital of Canada?", a: ["Toronto", "Ottawa", "Vancouver", "Montreal"], c: "Ottawa"},
                {q: "What is the capital of Switzerland?", a: ["Zurich", "Geneva", "Bern", "Basel"], c: "Bern"},
                {q: "What is the capital of Japan?", a: ["Kyoto", "Osaka", "Tokyo", "Nara"], c: "Tokyo"},
                {q: "What is the capital of Brazil?", a: ["Rio", "Sao Paulo", "Brasilia", "Salvador"], c: "Brasilia"},
                {q: "What is the capital of Egypt?", a: ["Cairo", "Alexandria", "Giza", "Luxor"], c: "Cairo"},
                {q: "What is the capital of Turkey?", a: ["Istanbul", "Ankara", "Izmir", "Bursa"], c: "Ankara"},
                {q: "What is the capital of Thailand?", a: ["Phuket", "Bangkok", "Chiang Mai", "Pattaya"], c: "Bangkok"},
                {q: "What is the capital of South Africa?", a: ["Cape Town", "Pretoria", "Johannesburg", "Durban"], c: "Pretoria"},
                {q: "What is the capital of Italy?", a: ["Venice", "Florence", "Naples", "Rome"], c: "Rome"}
            ]
        };

        let currentSet = [];
        let index = 0;
        let score = 0;
        let selected = null;
        let timer;
        let timeLeft = 15;

        function start(category) {
            // Pick 5 random questions from the pool of 10
            currentSet = [...database[category]].sort(() => Math.random() - 0.5).slice(0, 5);
            index = 0;
            score = 0;
            document.getElementById('home').classList.add('hide');
            document.getElementById('quiz').classList.remove('hide');
            loadQ();
        }

        function loadQ() {
            clearInterval(timer);
            timeLeft = 15;
            selected = null;
            updateUI();
            
            const data = currentSet[index];
            document.getElementById('count').innerText = `Question ${index + 1}/5`;
            document.getElementById('q-text').innerText = data.q;
            
            const container = document.getElementById('opt-container');
            container.innerHTML = '';
            
            // Shuffle the options too
            [...data.a].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.innerText = o;
                b.onclick = () => {
                    document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('active'));
                    b.classList.add('active');
                    selected = o;
                };
                container.appendChild(b);
            });

            timer = setInterval(() => {
                timeLeft--;
                updateUI();
                if(timeLeft <= 0) { clearInterval(timer); nextQ(); }
            }, 1000);
        }

        function updateUI() {
            document.getElementById('timer-bar').style.width = (timeLeft / 15 * 100) + "%";
            document.getElementById('time-left').innerText = timeLeft + "s";
        }

        document.getElementById('next').onclick = nextQ;

        function nextQ() {
            if(selected === currentSet[index].c) score++;
            index++;
            if(index < 5) loadQ();
            else finish();
        }

        function finish() {
            clearInterval(timer);
            document.getElementById('quiz').classList.add('hide');
            document.getElementById('result').classList.remove('hide');
            document.getElementById('final-score').innerText = `${score}/5`;
            document.getElementById('feedback').innerText = score > 3 ? "Wow! You're a Genius! 🚀" : "Nice try! Can you get a perfect score?";
        }
    </script>
</body>
            </html>
